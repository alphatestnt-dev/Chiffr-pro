name: Build Chiffr’EcoPro Android

on:
  push:
    branches: [ main, fix/quantity-surface-pricing ]
    paths:
      - 'android/**'
      - 'index.html'
      - 'app-v13.js'
      - 'navigation-v2.js'
      - 'documents-v2.js'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Validate JavaScript syntax
        run: |
          node --check app-v13.js
          node --check documents-v2.js
          node --check navigation-v2.js
          node --check runtime-stability.js
          node --check pwa.js

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - name: Build release AAB (unsigned)
        run: gradle -p android bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: ChiffrecoPro-Android-Clone
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
