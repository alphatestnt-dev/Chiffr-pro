name: Build Chiffr’EcoPro Android

on:
  push:
    branches: [ main, test/accueil-integre-securise-20261107 ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - name: Build release AAB (unsigned)
        run: gradle -p android bundleRelease

      - name: Package Android Studio project
        run: zip -r ChiffrecoPro-Android-Studio-Accueil.zip android

      - name: Upload APK, AAB and Android Studio project
        uses: actions/upload-artifact@v4
        with:
          name: ChiffrecoPro-Android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            ChiffrecoPro-Android-Studio-Accueil.zip
