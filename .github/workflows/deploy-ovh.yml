name: Deploy Chiffr’EcoPro to OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to OVH FTP
        uses: step-security/ftp-deploy-action@v4
        with:
          server: ftp.cluster129.hosting.ovh.net
          port: 21
          username: chiffri
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          server-dir: ./www/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
