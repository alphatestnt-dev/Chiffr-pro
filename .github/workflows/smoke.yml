name: Chiffr’EcoPro smoke tests

on:
  push:
    branches: [main, test/accueil-integre-securise-20261107]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app-v13.js
          node --check runtime-stability.js
          node --check barometre-pro-v1.js
          node --check documents-v2.js
          node --check navigation-v2.js
          node --check pricing-reference-v1.js
          node --check auth-v1.js
      - name: Start local server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/chiffrecopro-server.log 2>&1 &
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: npx playwright test tests/smoke.spec.js --reporter=line
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chiffrecopro-smoke-results
          path: test-results/
          if-no-files-found: ignore
