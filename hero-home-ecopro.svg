</g>
<!-- top slogans -->
<g filter="url(#shadow)"><rect x="80" y="75" width="610" height="120" rx="28" fill="#ffffff" fill-opacity=".82"/><text x="112" y="122" font-family="Georgia,serif" font-size="40" font-weight="700" fill="#fff" stroke="#244d3d" stroke-width="3" paint-order="stroke">Parce que le Monde a Besoin d’un</text><text x="112" y="168" font-family="Georgia,serif" font-size="40" font-weight="700" fill="#fff" stroke="#244d3d" stroke-width="3" paint-order="stroke">Avenir</text><rect x="485" y="132" width="175" height="40" rx="20" fill="#fff"/><text x="572" y="159" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="900" fill="#146b4a">Pensez Éco Logique</text></g>
<!-- benefits -->
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#17382c">
