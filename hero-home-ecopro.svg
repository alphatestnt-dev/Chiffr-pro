<g filter="url(#shadow)">
  <rect x="85" y="930" width="680" height="135" rx="28" fill="url(#panel)"/>
  <rect x="835" y="930" width="680" height="135" rx="28" fill="#fff"/>
  <text x="155" y="1012" font-family="Arial,sans-serif" font-size="31" font-weight="900" fill="#fff">👷 Espace Professionnel</text>
  <text x="905" y="1012" font-family="Arial,sans-serif" font-size="31" font-weight="900" fill="#17382c">🏠 Espace Particulier</text>
  <circle cx="700" cy="997" r="31" fill="#fff"/><text x="700" y="1008" text-anchor="middle" font-size="35" fill="#146b4a">›</text>
  <circle cx="1450" cy="997" r="31" fill="#146b4a"/><text x="1450" y="1008" text-anchor="middle" font-size="35" fill="#fff">›</text>
