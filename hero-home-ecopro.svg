<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">Chiffr’EcoPro — construisons aujourd’hui le monde plus propre de demain</title>
<desc id="desc">Accueil Chiffr’EcoPro avec nature, écologie, logo et accès aux espaces professionnel et particulier.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bde8f5"/><stop offset=".58" stop-color="#f7f2d9"/><stop offset="1" stop-color="#e8c985"/></linearGradient>
  <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#285e55"/><stop offset="1" stop-color="#75a46d"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e754e"/><stop offset="1" stop-color="#43a85c"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0d6b49"/><stop offset="1" stop-color="#0a4b37"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".18"/></filter>
</defs>
<rect width="1600" height="1120" rx="26" fill="url(#sky)"/>
<!-- leafy frame -->
<g fill="#4e9c3e" opacity=".96">
  <path d="M0 0h250C160 90 120 210 0 280z"/><path d="M1600 0h-240c90 90 130 210 240 280z"/>
  <path d="M0 520C90 430 120 350 230 300c-20 120-70 210-230 300z"/><path d="M1600 520c-90-90-120-170-230-220 20 120 70 210 230 300z"/>
