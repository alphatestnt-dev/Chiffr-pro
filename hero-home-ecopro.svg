</g>
<g fill="#78b94d" opacity=".8"><ellipse cx="95" cy="95" rx="55" ry="22" transform="rotate(-45 95 95)"/><ellipse cx="1505" cy="100" rx="55" ry="22" transform="rotate(45 1505 100)"/><ellipse cx="110" cy="890" rx="65" ry="24" transform="rotate(35 110 890)"/><ellipse cx="1490" cy="900" rx="65" ry="24" transform="rotate(-35 1490 900)"/></g>
<!-- distant landscape -->
<path d="M0 670Q240 500 450 650T900 610t700 40v430H0z" fill="url(#hill)" opacity=".9"/>
<path d="M0 730Q270 610 520 710t460-10 620 40v380H0z" fill="#6f9a70" opacity=".8"/>
<ellipse cx="800" cy="840" rx="690" ry="210" fill="#5d8f67" opacity=".55"/>
<!-- sun --> <circle cx="800" cy="790" r="170" fill="#ffd76c" opacity=".35"/>
<!-- central logo plate -->
<g filter="url(#shadow)">
  <circle cx="800" cy="370" r="178" fill="#fff" opacity=".9"/>
  <path d="M665 390c0-120 85-205 190-205 48 0 88 15 123 43-44-13-82-10-116 6-72 34-99 110-83 182 14 62 54 105 111 126-21 8-43 12-66 12-91 0-159-66-159-164z" fill="none" stroke="#0b6a49" stroke-width="26"/>
  <path d="M792 370c62-78 139-90 217-56-46 14-80 42-101 84-17 34-27 69-25 108-55-29-88-70-91-136z" fill="#48a94f"/>
  <path d="M810 454c43-5 81-22 111-55" fill="none" stroke="#146b4a" stroke-width="10" stroke-linecap="round"/>
  <text x="800" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="84" font-weight="900" fill="#101a16">Chiffr’<tspan fill="#1a8750">EcoPro</tspan></text>
