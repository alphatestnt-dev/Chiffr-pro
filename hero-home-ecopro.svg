  <g transform="translate(610 735)"><circle r="46" fill="#fff"/><text y="12" font-size="35">◈</text><text y="78" font-size="20" font-weight="800">Éco-responsable</text></g>
  <g transform="translate(970 735)"><circle r="46" fill="#fff"/><text y="12" font-size="35">◉</text><text y="78" font-size="20" font-weight="800">Un outil simple</text></g>
  <g transform="translate(1330 735)"><circle r="46" fill="#fff"/><text y="12" font-size="35">♟</text><text y="78" font-size="20" font-weight="800">Pour tous</text></g>
</g>
<!-- family silhouette -->
<g fill="#6d4732"><circle cx="690" cy="835" r="45"/><circle cx="875" cy="850" r="38"/><path d="M615 1070c5-130 35-190 75-190s70 60 75 190z"/><path d="M820 1070c5-115 28-175 55-175s55 60 60 175z"/></g>
<path d="M730 910q80 80 120 10" fill="none" stroke="#6d4732" stroke-width="28" stroke-linecap="round"/>
